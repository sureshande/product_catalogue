name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style (Pint)
        run: ./vendor/bin/pint --test
      - name: Tests (Pest, SQLite in-memory, no network)
        run: ./vendor/bin/pest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack and smoke test it
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/api/products/featured | grep -q '"data"'
          curl -fsS -X POST http://localhost:8080/api/enquiries \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"product_id":3,"name":"CI","email":"ci@example.test"}'
          sleep 3
          curl -fsS http://localhost:8025/api/v1/messages | grep -q 'New enquiry'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
